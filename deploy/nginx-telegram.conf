# Nginx: приём HTTPS (443) на публичном домене и проксирование во внутреннее
# приложение BotPilot на localhost:3000. Даёт Telegram валидный HTTPS-URL для
# webhook вида https://api.домен.ru/api/telegram/webhook/{botId}.
#
# 1) Получите сертификат: sudo certbot --nginx -d api.домен.ru
# 2) Задайте в .env приложения: WEBHOOK_BASE_URL=https://api.домен.ru
# 3) Перезапустите приложение и нажмите «Проверить подключение» в кабинете.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.xn--80a.ru api.example.com;   # ← ваш домен
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.xn--80a.ru api.example.com;    # ← ваш домен

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Вебхук Telegram: без авторизации, без редиректов, метод POST проходит
    # как есть. Заголовок X-Telegram-Bot-Api-Secret-Token передаём в приложение.
    location /api/telegram/webhook/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_redirect off;                 # никаких редиректов
        proxy_read_timeout 30s;
    }

    # Остальное приложение
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
